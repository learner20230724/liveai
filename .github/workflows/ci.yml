name: Verify LiveAI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-parallel-tools.mjs
      - run: node scripts/check-live-upload.mjs
      - run: node scripts/check-audio-inputs.mjs
      - run: node scripts/check-call-settings.mjs
      - run: node scripts/check-conversation.mjs
      - run: node scripts/check-browser-extension.mjs
