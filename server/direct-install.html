<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveAI 官网直连</title><style>body{font:16px/1.9 system-ui;max-width:680px;margin:8vh auto;padding:24px;color:#34483a;background:#fafbf8}a{color:#497d48}li{margin:16px 0}h1{font-size:28px}</style><h1>安装 LiveAI 直连扩展</h1><ol><li><a href="/liveai/downloads/liveai-direct-extension.zip">下载扩展 ZIP</a>，解压到一个固定文件夹。</li><li>Chrome 打开 <code>chrome://extensions</code>；Edge 打开 <code>edge://extensions</code>。</li><li>开启「开发者模式」，点击「加载已解压的扩展程序」，选择解压后的文件夹。</li><li>回到 <a href="/liveai/">LiveAI</a>，刷新并登录。右上角显示「官网直连」后即可开始。</li></ol><p>已安装旧版：把新文件解压覆盖原文件夹，在扩展管理页点击「重新加载」，再刷新 LiveAI。</p></html>
